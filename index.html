<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: #111827;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg-dark); color: #fff; overflow: hidden; }

    #sidebar { width: 380px; display: flex; flex-direction: column; background: var(--panel-bg); border-right: 1px solid var(--border-color); }
    .media-tabs { display: flex; border-bottom: 1px solid var(--border-color); background: #0c121e; }
    .media-tab {
      flex: 1; padding: 14px 8px; text-align: center; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; color: var(--text-muted);
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .media-tab:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .media-tab.active { color: #fff; border-bottom: 2px solid var(--accent); background: rgba(37,99,235,0.1); }

    .search-bar { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    .search-bar input {
      width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);
      background: #080c14; color: #fff; font-size: 13px; outline: none;
    }
    .search-bar input:focus { border-color: var(--accent); }

    #category-container { flex: 1; overflow-y: auto; padding: 8px; }
    .group-item { margin-bottom: 6px; border-radius: 6px; overflow: hidden; background: #0c121e; }
    .group-header {
      padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      background: #151d2c; user-select: none;
    }
    .group-header:hover { background: #1a2538; }
    .group-count { font-size: 11px; color: var(--text-muted); background: #080c14; padding: 2px 6px; border-radius: 10px; }
    .group-channels { display: none; list-style: none; padding: 4px 0; }
    .group-item.open .group-channels { display: block; }
    .group-item.open .arrow { transform: rotate(90deg); }
    .arrow { font-size: 10px; transition: transform 0.2s; display: inline-block; margin-right: 6px; }

    .channel-row {
      padding: 8px 12px 8px 26px; font-size: 13px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #cbd5e1; border-left: 2px solid transparent;
    }
    .channel-row:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .channel-row.active { background: rgba(37,99,235,0.15); border-left-color: var(--accent); color: #fff; font-weight: 600; }

    .sidebar-footer {
      padding: 10px 14px; border-top: 1px solid var(--border-color); display: flex;
      justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted);
    }
    .settings-btn {
      background: none; border: none; color: var(--text-muted); font-size: 18px;
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
    }
    .settings-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    #player-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; position: relative; }
    video { width: 100%; height: 100%; max-height: 100vh; background: #000; }
    #current-title {
      position: absolute; top: 16px; left: 20px; background: rgba(0,0,0,0.65);
      padding: 6px 12px; border-radius: 6px; font-size: 14px; pointer-events: none;
      display: none;
    }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-box {
      background: #111827; border: 1px solid var(--border-color); border-radius: 10px;
      width: 440px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .close-modal { cursor: pointer; color: var(--text-muted); font-size: 18px; }
    .modal-box input[type="text"] {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
      background: #080c14; color: #fff; margin-bottom: 10px; font-size: 13px; outline: none;
    }
    .modal-box button {
      width: 100%; padding: 10px; border-radius: 6px; border: none; background: var(--accent);
      color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 8px; font-size: 13px;
    }
    .modal-box button:hover { background: var(--accent-hover); }
    .danger-btn { background: #dc2626 !important; margin-top: 10px; }
    .danger-btn:hover { background: #b91c1c !important; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="media-tabs">
      <div class="media-tab active" onclick="switchMediaType('live')">Live TV</div>
      <div class="media-tab" onclick="switchMediaType('movie')">Filme</div>
      <div class="media-tab" onclick="switchMediaType('series')">Serien</div>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Sender oder Titel suchen..." oninput="filterList()">
    </div>

    <div id="category-container"></div>

    <div class="sidebar-footer">
      <span id="status-info">Lade Speicher...</span>
      <button class="settings-btn" title="Liste verwalten" onclick="toggleModal(true)">⚙</button>
    </div>
  </div>

  <div id="player-container">
    <div id="current-title"></div>
    <video id="video" controls autoplay playsinline></video>
  </div>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>
        Playlist Einstellungen
        <span class="close-modal" onclick="toggleModal(false)">✕</span>
      </h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Unbegrenzter lokaler Speicher (IndexedDB).</p>
      
      <input type="text" id="m3u-url" placeholder="M3U / M3U8 URL einfügen...">
      <button onclick="loadFromUrl()">Von URL laden</button>
      
      <div style="text-align:center; font-size:11px; color:var(--text-muted); margin: 6px 0;">— ODER DATEI WÄHLEN —</div>
      
      <input type="file" id="file-input" accept=".m3u,.m3u8,.txt" style="display:none" onchange="loadFromFile(event)">
      <button style="background:#374151;" onclick="document.getElementById('file-input').click()">M3U Datei vom Gerät wählen</button>
      
      <button class="danger-btn" onclick="clearPlaylist()">Gespeicherte Liste löschen</button>
    </div>
  </div>

  <script>
    let allChannels = [];
    let currentType = 'live';
    const video = document.getElementById('video');
    let hls = null;

    // Basis-URL deines Cloudflare Workers zur Mixed-Content-Überbrückung
    const PROXY_BASE = "https://stream-proxy.alaturka88-na.workers.dev/?url=";

    // --- IndexedDB Initialisierung ---
    const DB_NAME = 'StreamPlayerDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'channels';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToDB(list) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.clear();
      list.forEach(item => store.add(item));
      return new Promise((resolve) => tx.oncomplete = () => resolve());
    }

    async function loadFromDB() {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      return new Promise((resolve) => req.onsuccess = () => resolve(req.result || []));
    }

    async function clearDB() {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      return new Promise((resolve) => tx.oncomplete = () => resolve());
    }

    // --- Start beim Laden der Seite ---
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        allChannels = await loadFromDB();
        updateStatus();
        renderCategories();
      } catch (e) {
        document.getElementById('status-info').textContent = 'Fehler beim Laden';
      }
    });

    function parseM3U(content) {
      const lines = content.split('\n');
      const list = [];
      let currentItem = null;

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (line.startsWith('#EXTINF:')) {
          currentItem = { name: 'Unbekannt', group: 'Allgemein', type: 'live', url: '' };

          const groupMatch = line.match(/group-title="([^"]+)"/i);
          if (groupMatch) currentItem.group = groupMatch[1];

          const commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            currentItem.name = line.substring(commaIndex + 1).trim();
          }

          const lowerGroup = currentItem.group.toLowerCase();
          if (lowerGroup.includes('movie') || lowerGroup.includes('film') || lowerGroup.includes('vod') || lowerGroup.includes('kino')) {
            currentItem.type = 'movie';
          } else if (lowerGroup.includes('series') || lowerGroup.includes('serie') || lowerGroup.includes('dizi')) {
            currentItem.type = 'series';
          } else {
            currentItem.type = 'live';
          }
        } else if (line.length > 0 && !line.startsWith('#') && currentItem) {
          currentItem.url = line;
          const cleanUrl = line.split('?')[0].toLowerCase();
          if (currentItem.type === 'live') {
            if (cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.mkv') || cleanUrl.endsWith('.avi')) {
              currentItem.type = 'movie';
            } else if (cleanUrl.includes('/series/')) {
              currentItem.type = 'series';
            }
          }
          list.push(currentItem);
          currentItem = null;
        }
      }
      return list;
    }

    function switchMediaType(type) {
      currentType = type;
      document.querySelectorAll('.media-tab').forEach((tab, idx) => {
        const tabTypes = ['live', 'movie', 'series'];
        tab.classList.toggle('active', tabTypes[idx] === type);
      });
      document.getElementById('search-input').value = '';
      renderCategories();
    }

    function renderCategories() {
      const container = document.getElementById('category-container');
      container.innerHTML = '';

      const search = document.getElementById('search-input').value.toLowerCase();
      const filtered = allChannels.filter(c => {
        const matchesType = c.type === currentType;
        const matchesSearch = c.name.toLowerCase().includes(search) || c.group.toLowerCase().includes(search);
        return matchesType && matchesSearch;
      });

      const groups = {};
      filtered.forEach(c => {
        if (!groups[c.group]) groups[c.group] = [];
        groups[c.group].push(c);
      });

      const groupNames = Object.keys(groups).sort();
      if (groupNames.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:13px;">Keine Einträge vorhanden.</div>';
        return;
      }

      groupNames.forEach(groupName => {
        const groupEl = document.createElement('div');
        groupEl.className = 'group-item';

        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `
          <div><span class="arrow">▶</span> ${groupName}</div>
          <span class="group-count">${groups[groupName].length}</span>
        `;
        header.onclick = () => groupEl.classList.toggle('open');

        const chList = document.createElement('ul');
        chList.className = 'group-channels';

        groups[groupName].forEach(ch => {
          const li = document.createElement('li');
          li.className = 'channel-row';
          li.textContent = ch.name;
          li.title = ch.name;
          li.onclick = (e) => {
            e.stopPropagation();
            playStream(ch.url, ch.name, li);
          };
          chList.appendChild(li);
        });

        groupEl.appendChild(header);
        groupEl.appendChild(chList);
        container.appendChild(groupEl);
      });
    }

    function filterList() {
      renderCategories();
    }

    function playStream(url, name, element) {
      document.querySelectorAll('.channel-row').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      const titleEl = document.getElementById('current-title');
      titleEl.style.display = 'block';
      titleEl.textContent = name;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      // Stream über Cloudflare Worker leiten, wenn es eine HTTP-URL ist
      const playableUrl = url.startsWith("http://") ? (PROXY_BASE + encodeURIComponent(url)) : url;

      const isHls = url.includes('.m3u8') || (!url.includes('.mp4') && !url.includes('.mkv'));

      if (isHls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(playableUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            console.error('Stream-Fehler:', data);
          }
        });
      } else {
        video.src = playableUrl;
        video.play().catch(() => {});
      }
    }

    function toggleModal(show) {
      document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    async function loadFromUrl() {
      const inputUrl = document.getElementById('m3u-url').value.trim();
      if (!inputUrl) return alert('Bitte URL angeben.');
      
      // Nutzt den Cloudflare Proxy auch zum Abrufen der M3U-URL (verhindert CORS-Fehler beim Import)
      const fetchUrl = inputUrl.startsWith("http://") ? (PROXY_BASE + encodeURIComponent(inputUrl)) : inputUrl;

      document.getElementById('status-info').textContent = 'Lade URL über Proxy...';
      try {
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('Netzwerk-Antwort war nicht OK');
        const text = await res.text();
        await saveData(parseM3U(text));
        toggleModal(false);
      } catch (err) {
        alert('Fehler beim Abrufen der URL. Nutze alternativ den Button "M3U Datei vom Gerät wählen".');
        updateStatus();
      }
    }

    function loadFromFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('status-info').textContent = 'Lese Datei ein...';
      const reader = new FileReader();
      reader.onload = async (event) => {
        const list = parseM3U(event.target.result);
        await saveData(list);
        toggleModal(false);
      };
      reader.readAsText(file);
    }

    async function saveData(list) {
      allChannels = list;
      document.getElementById('status-info').textContent = 'Speichere in Datenbank...';
      await saveToDB(list);
      updateStatus();
      renderCategories();
    }

    async function clearPlaylist() {
      if (confirm('Gesamte Playlist dauerhaft löschen?')) {
        await clearDB();
        allChannels = [];
        updateStatus();
        renderCategories();
        if (hls) hls.destroy();
        video.pause();
        video.src = '';
        document.getElementById('current-title').style.display = 'none';
        toggleModal(false);
      }
    }

    function updateStatus() {
      const info = document.getElementById('status-info');
      if (allChannels.length > 0) {
        info.textContent = `${allChannels.length} Einträge gespeichert`;
      } else {
        info.textContent = 'Keine Liste vorhanden';
      }
    }
  </script>
</body>
</html>
